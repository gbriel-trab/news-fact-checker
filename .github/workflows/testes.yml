# Roda a suíte a cada push e pull request na main, numa máquina limpa.
#
# A suíte é offline por construção (tests/conftest.py bloqueia socket): não
# há chave de API aqui, nem .env, nem banco, nem gabarito local — os testes
# que dependem do gabarito pulam dizendo por quê. O único download é o
# modelo de embeddings, público, feito ANTES dos testes e guardado em cache.
name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências (torch só CPU, para não baixar CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache do modelo de embeddings
        id: modelo
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Baixa o modelo se não estiver em cache
        if: steps.modelo.outputs.cache-hit != 'true'
        run: python -c "from sentence_transformers import SentenceTransformer as S; S('paraphrase-multilingual-MiniLM-L12-v2')"

      - name: Testes (sem rede, sem chave)
        run: python -m pytest -q -p no:cacheprovider
